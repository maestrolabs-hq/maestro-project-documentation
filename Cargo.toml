# The documentation workspace: one checker, because it is the only custom code.

[workspace]
resolver = "3"
members = ["crates/sitecheck"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
