<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" role="img" aria-labelledby="title description">
  <title id="title">Maestro</title>
  <desc id="description">The Maestro wordmark, with its final letter in brass.</desc>
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("../fonts/CormorantGaramond-b20b7d96.ttf") format("truetype");
      font-weight: 600;
    }

    svg {
      color: #f5f0e8;
      --maestro-wordmark-accent: #c8a75a;
    }

    .wordmark {
      fill: currentColor;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 82px;
      font-weight: 600;
      letter-spacing: 15px;
    }

    .accent {
      fill: var(--maestro-wordmark-accent, currentColor);
    }

    .monochrome .accent {
      fill: currentColor;
    }

    @media (forced-colors: active) {
      .accent { fill: currentColor; }
    }
  </style>
  <text class="wordmark" x="24" y="86">MAESTR<tspan class="accent">O</tspan></text>
</svg>
