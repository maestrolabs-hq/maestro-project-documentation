<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 120" role="img" aria-labelledby="title description">
  <title id="title">Maestro</title>
  <desc id="description">The Maestro wordmark, with its final letter in the link accent colour.</desc>
  <style>
    @font-face {
      font-family: "Geist";
      src: url("../fonts/Geist-SemiBold.woff2") format("woff2");
      font-weight: 600;
    }

    svg {
      color: #ffffff;
      --maestro-wordmark-accent: #0070f3;
    }

    .wordmark {
      fill: currentColor;
      font-family: "Geist", "Inter", system-ui, -apple-system, sans-serif;
      font-size: 82px;
      font-weight: 600;
      letter-spacing: -3px;
    }

    .accent {
      fill: var(--maestro-wordmark-accent, currentColor);
    }

    .monochrome .accent {
      fill: currentColor;
    }

    @media (forced-colors: active) {
      .accent { fill: currentColor; }
    }
  </style>
  <text class="wordmark" x="24" y="86">MAESTR<tspan class="accent">O</tspan></text>
</svg>
